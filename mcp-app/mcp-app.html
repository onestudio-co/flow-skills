<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FLOW Cycle Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      color: #e0e0e6;
      padding: 20px;
      min-height: 100vh;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }

    .header .badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(255, 86, 25, 0.15);
      color: #ff5619;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .summary-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .summary-card {
      flex: 1;
      padding: 14px 18px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .summary-card .label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .summary-card .value {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }

    .cycles-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .cycle-card {
      padding: 16px 20px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: all 0.2s;
      display: grid;
      grid-template-columns: 8px 1fr auto;
      gap: 16px;
      align-items: center;
    }

    .cycle-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .cycle-card.expanded {
      grid-template-columns: 8px 1fr;
      border-color: rgba(255, 86, 25, 0.3);
    }

    .health-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .health-dot.green { background: #22c55e; box-shadow: 0 0 6px rgba(34, 197, 94, 0.4); }
    .health-dot.yellow { background: #eab308; box-shadow: 0 0 6px rgba(234, 179, 8, 0.4); }
    .health-dot.red { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.4); }
    .health-dot.gray { background: #666; }

    .cycle-info h3 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .cycle-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #888;
    }

    .cycle-meta .mode {
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .mode.discovery {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
    }

    .mode.outcome {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .cycle-days {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
    }

    .detail-panel {
      margin-top: 12px;
      padding: 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      grid-column: 1 / -1;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 13px;
    }

    .detail-row:last-child { border-bottom: none; }
    .detail-row .detail-label { color: #888; }
    .detail-row .detail-value { color: #e0e0e6; font-weight: 500; }

    .kill-condition {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.15);
      font-size: 12px;
      color: #f87171;
    }

    .kill-condition strong { color: #fca5a5; }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 86, 25, 0.3);
      background: rgba(255, 86, 25, 0.1);
      color: #ff5619;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: rgba(255, 86, 25, 0.2);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">Connecting to FLOW...</div>
  </div>
  <script type="module" src="/src/mcp-app.ts"></script>
</body>
</html>
